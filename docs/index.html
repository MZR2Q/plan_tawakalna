<!DOCTYPE html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خطة إطلاق خدمات جامعة حفر الباطن في توكلنا</title>
<style>
  /* هوية بيضاء مينمالستك — بألوان واجهة توكلنا */
  :root{
    --bg:#ffffff; --ink:#1e3a5f; --navy:#17335a; --gold:#d9a842;
    --muted:#8b94a3; --soft:#f6f8fa; --line:#e8ecf1; --tw:#0f9d63;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    direction:rtl; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",system-ui,sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1080px; margin:0 auto; padding:1.5rem 1.15rem 3rem; }

  /* الترويسة */
  .top{
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding-bottom:1.1rem; border-bottom:1px solid var(--line);
  }
  .top img{ display:block; height:auto; }
  .top .uni{ width:104px; }
  .top .tw-logo{ width:96px; }

  .hero{ text-align:center; padding:1.8rem 0 1.4rem; max-width:640px; margin:0 auto; }
  .hero .kicker{ font-size:.72rem; font-weight:700; letter-spacing:.1em; color:var(--tw); }
  h1{ margin:.35rem 0 .4rem; font-size:clamp(1.35rem,4.8vw,1.7rem); font-weight:800; text-wrap:balance; }
  .hero p{ margin:0 auto; max-width:46ch; color:var(--muted); font-size:.92rem; }

  /* تخطيط: قائمة + معاينة جانبية لسطح المكتب */
  .layout{ display:grid; grid-template-columns:1fr; gap:1.6rem; align-items:start; }
  @media(min-width:920px){ .layout{ grid-template-columns:1fr 340px; } }

  .list-head{
    margin:0 0 1rem; font-size:1.02rem; font-weight:800; color:var(--ink);
    display:flex; align-items:center; gap:.55rem;
  }
  .list-head::after{ content:""; flex:1; height:1px; background:var(--line); }
  .list-hint{ font-size:.74rem; color:var(--muted); font-weight:600; }

  /* بطاقة الخدمة */
  .svc{
    border:1px solid var(--line); border-radius:16px; margin-bottom:.8rem; background:#fff;
    overflow:hidden; transition:border-color .2s, box-shadow .2s;
  }
  .svc.active{ border-color:var(--navy); box-shadow:0 4px 18px rgba(23,51,90,.08); }
  .svc .card-btn{
    all:unset; box-sizing:border-box; display:block; width:100%; cursor:pointer; padding:1rem 1.05rem;
  }
  .svc .card-btn:focus-visible{ outline:3px solid var(--gold); outline-offset:-3px; border-radius:16px; }
  .svc .head{ display:flex; align-items:center; gap:.6rem; }
  .svc .num{
    flex:0 0 auto; width:24px; height:24px; border-radius:8px; display:grid; place-items:center;
    background:var(--navy); color:var(--gold); font-size:.75rem; font-weight:800;
  }
  .svc h3{ margin:0; font-size:.97rem; font-weight:800; }
  .svc .sys{
    margin-inline-start:auto; font-size:.64rem; font-weight:700; padding:.15rem .55rem;
    border-radius:99px; background:var(--soft); color:var(--muted); white-space:nowrap;
  }
  .svc .chev{ flex:0 0 auto; color:var(--muted); font-size:.7rem; transition:transform .25s; }
  .svc.active .chev{ transform:rotate(180deg); }
  .svc .desc{ margin:.45rem 0 .55rem; font-size:.84rem; color:var(--muted); }
  .aud-line{ display:flex; align-items:center; gap:.4rem; font-size:.78rem; margin-bottom:.55rem; color:var(--muted); }
  .aud-line b{ color:var(--navy); font-weight:700; }
  .aud-line::before{ content:"◉"; font-size:.6rem; color:var(--tw); }
  .req-ttl{ font-size:.7rem; font-weight:800; color:var(--tw); margin-bottom:.3rem; }
  .svc ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:.32rem; }
  .svc li{ position:relative; padding-inline-start:1rem; font-size:.82rem; color:var(--ink); }
  .svc li::before{ content:""; position:absolute; right:0; top:.62em; width:6px; height:6px; border-radius:2px; background:var(--gold); }
  .svc li .src{ color:var(--muted); font-size:.77rem; }

  /* مؤشر المراحل */
  .stages{ display:flex; margin-top:1rem; padding-top:.9rem; border-top:1px dashed var(--line); }
  .stg{ position:relative; flex:1; display:flex; flex-direction:column; align-items:center; gap:.35rem; }
  .stg::before{
    content:""; position:absolute; top:12px; left:50%; width:100%; height:2px;
    background:var(--line); transition:background .3s;
  }
  .stg:first-child::before{ display:none; }
  .stg .dot{
    position:relative; z-index:1; width:25px; height:25px; border-radius:50%;
    display:grid; place-items:center; background:#fff; border:2px solid var(--line);
    color:#c8ced7; font-size:.68rem; font-weight:800; transition:all .3s;
  }
  .stg .lbl{ font-size:.62rem; font-weight:700; color:var(--muted); }
  .stg.done::before{ background:var(--tw); }
  .stg.done .dot{ background:var(--tw); border-color:var(--tw); color:#fff; box-shadow:0 3px 10px rgba(15,157,99,.35); }
  .stg.done .lbl{ color:var(--navy); }

  /* الانسدال (جوال فقط) */
  .drop{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease; }
  .drop > div{ overflow:hidden; }
  .svc.active .drop{ grid-template-rows:1fr; }
  .drop .phone-slot{ display:flex; justify-content:center; padding:0 1rem 1.2rem; }
  @media(min-width:920px){ .drop{ display:none; } }

  /* المعاينة الجانبية (سطح المكتب فقط) */
  .preview{ display:none; }
  @media(min-width:920px){
    .preview{ display:block; position:sticky; top:1.2rem; }
    .preview .cap{ text-align:center; font-size:.74rem; color:var(--muted); margin-top:.7rem; }
  }

  /* فريم الجوال — مطابق لواجهة توكلنا الحقيقية */
  .phone{
    width:290px; max-width:100%; border-radius:36px; padding:11px; background:#0e1420;
    box-shadow:0 18px 44px rgba(23,51,90,.22), inset 0 0 0 2px rgba(255,255,255,.06);
    margin:0 auto;
  }
  .screen{
    position:relative; border-radius:27px; overflow:hidden; background:#fff;
    aspect-ratio:9/18; display:flex; flex-direction:column;
  }
  .sbar{ display:flex; justify-content:space-between; align-items:center; padding:.55rem .9rem .2rem; font-size:.58rem; color:#333; font-weight:600; }
  .apphead{ display:flex; align-items:center; gap:.45rem; padding:.55rem .7rem .4rem; }
  .x-btn{ flex:0 0 auto; width:30px; height:30px; border:1.6px solid #23324a; border-radius:50%; display:grid; place-items:center; color:#23324a; font-size:.8rem; font-weight:700; }
  .apphead .ttl{ flex:1; min-width:0; font-size:.76rem; font-weight:700; color:#1e3a5f; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .caps{ flex:0 0 auto; display:flex; align-items:center; gap:.5rem; border:1.6px solid #23324a; border-radius:999px; padding:.28rem .6rem; color:#23324a; }
  .caps .i{ font-size:.72rem; line-height:1; }
  .caps .sep{ width:1px; height:12px; background:#23324a55; }
  .svc-row{ display:flex; align-items:flex-start; justify-content:space-between; padding:.9rem 1rem .3rem; }
  .svc-row .t .g{ font-size:.62rem; color:#9aa3b0; }
  .svc-row .t .n{ font-size:.85rem; font-weight:800; color:#1e3a5f; line-height:1.4; }
  .svc-row img{ width:44px; height:auto; display:block; }
  .navy-card{ margin:.8rem .8rem; background:var(--navy); border-radius:20px; padding:1rem .95rem 1.05rem; color:#fff; text-align:right; }
  .navy-card .who{ font-size:.7rem; opacity:.85; margin-bottom:.2rem; }
  .navy-card .who b{ font-size:.79rem; color:#fff; display:block; opacity:1; }
  .kv{ display:flex; align-items:center; justify-content:space-between; padding:.42rem 0; border-bottom:1px solid #ffffff14; }
  .kv:last-child{ border-bottom:none; }
  .kv .k{ font-size:.68rem; color:#c9d3e2; }
  .kv .v{ font-size:.76rem; font-weight:800; color:var(--gold); }
  .big-line{ display:flex; align-items:center; justify-content:space-between; margin-top:.55rem; }
  .big-line .lbl{ font-size:.68rem; color:var(--gold); font-weight:700; }
  .big-line .v{ font-size:1.45rem; font-weight:800; color:var(--gold); }
  .big-line .v small{ font-size:.68rem; font-weight:700; color:#e8c887; }
  .bar{ margin-top:.7rem; height:7px; border-radius:99px; background:#ffffff22; overflow:hidden; }
  .bar i{ display:block; height:100%; background:var(--gold); border-radius:99px; }
  .bar-lbl{ display:flex; justify-content:space-between; margin-top:.4rem; font-size:.62rem; color:#c9d3e2; }
  .bar-lbl b{ color:var(--gold); }

  /* التذييل */
  .foot{ margin-top:2.6rem; padding-top:1.2rem; border-top:1px solid var(--line); text-align:center; }
  .foot .lbl{ font-size:.74rem; color:var(--muted); margin-bottom:.5rem; }
  .foot img{ width:170px; max-width:70%; height:auto; }
  .foot .fine{ margin-top:.8rem; font-size:.68rem; color:var(--muted); }

  @media (prefers-reduced-motion: reduce){ .drop, .svc .chev{ transition:none; } }
</style>

  if (s.big) card += `<div class="big-line"><span class="lbl">${s.big.lbl}</span><span class="v">${s.big.v} <small>${s.big.u}</small></span></div>`;
  if (s.bar) card += `<div class="bar"><i style="width:${s.bar.p}%"></i></div><div class="bar-lbl"><span>${s.bar.lbl}</span><b>${s.bar.txt}</b></div>`;
  if (s.kv)  card += s.kv.map(([k,v]) => `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");
  return `
  <div class="phone">
    <div class="screen">
      <div class="sbar"><span>stc &nbsp;٥:٣٨</span><span>▂▄▆ ●</span></div>
      <div class="apphead">
        <span class="x-btn">✕</span>
        <span class="ttl">${s.name} جامعة حفر الباطن</span>
        <span class="caps"><span class="i">☰</span><span class="sep"></span><span class="i">⊞</span></span>
      </div>
      <div class="svc-row">
        <div class="t"><div class="g">الخدمات</div><div class="n">${s.name}</div></div>
        <img src="${UNI_LOGO}" alt="" />
      </div>
      <div class="navy-card">${card}</div>
    </div>
  </div>`;
}

/* مراحل كل خدمة — prog: عدد المراحل المكتملة (0 = كلها معلّقة) */
const STAGES = ["اعتماد", "المتطلبات", "التنفيذ", "الإطلاق"];
const PROGRESS = { };   /* مثال للتفعيل لاحقًا: {0:1} يعني الخدمة ١ اجتازت الاعتماد */

/* بناء القائمة */
const list = document.getElementById("list");
SERVICES.forEach((s, i) => {
  const reqs = s.reqs.map(([r, src]) =>
    `<li>${r}${src ? ` <span class="src">— ${src}</span>` : ""}</li>`).join("");
  const prog = PROGRESS[i] || 0;
  const stages = STAGES.map((t, k) =>
    `<div class="stg ${k < prog ? "done" : ""}"><span class="dot">✓</span><span class="lbl">${t}</span></div>`).join("");
  const el = document.createElement("div");
  el.className = "svc"; el.id = "svc-" + i;
  el.innerHTML = `
    <button class="card-btn" aria-expanded="false" aria-controls="drop-${i}">
      <div class="head">
        <span class="num">${s.num}</span><h3>${s.name}</h3>
        <span class="sys">${s.sys}</span><span class="chev">▼</span>
      </div>
      <p class="desc">${s.desc}</p>
      <div class="aud-line">الفئة المستهدفة: <b>${s.aud}</b></div>
      <div class="req-ttl">المتطلبات</div>
      <ul>${reqs}</ul>
      <div class="stages" aria-label="مراحل الخدمة">${stages}</div>
    </button>
    <div class="drop" id="drop-${i}"><div><div class="phone-slot"></div></div></div>`;
  el.querySelector(".card-btn").addEventListener("click", () => select(i));
  list.appendChild(el);
});

const previewSlot = document.getElementById("preview-slot");
const previewCap  = document.getElementById("preview-cap");
const isDesktop = () => matchMedia("(min-width:920px)").matches;
let current = -1;

function select(i){
  const cards = document.querySelectorAll(".svc");
  if (!isDesktop() && current === i){          /* جوال: نقرة ثانية تطوي */
    cards[i].classList.remove("active");
    cards[i].querySelector(".card-btn").setAttribute("aria-expanded","false");
    current = -1; return;
  }
  current = i;
  cards.forEach((c, j) => {
    c.classList.toggle("active", j === i);
    c.querySelector(".card-btn").setAttribute("aria-expanded", j === i ? "true" : "false");
    const slot = c.querySelector(".phone-slot");
    if (j === i && !slot.innerHTML) slot.innerHTML = screenHTML(SERVICES[i]);
  });
  previewSlot.innerHTML = screenHTML(SERVICES[i]);
  previewCap.textContent = "معاينة: " + SERVICES[i].name;
}

select(0);   /* افتراضيًا: الخدمة الأولى */
</script>
</html>
