<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <title>مرحبًا</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main class="card">

    <h1 class="title">مرحبًا <span class="wave" aria-hidden="true">👋</span></h1>
    <p class="subtitle">

      <span class="tag">HTML</span>
      <span class="tag">CSS</span>
      <span class="tag">JavaScript</span>

    <div class="clock" id="clock" aria-live="polite">--:--:--</div>

    <button class="btn" id="greetBtn" type="button">اضغط لتحية جديدة</button>
    <p class="msg" id="msg"></p>
  </main>

  <footer class="foot">مشروع plan_tawakalna</footer>

  <script src="script.js"></script>

</html>
